 name: Adaptive Ensemble Signal Bot

on:
  schedule:
    # Запуск каждый час в 00 минут. Ты можешь изменить на '0 */4 * * *' для раз в 4 часа.
    - cron: '0 * * * *'
  # Позволяет запустить бота вручную из вкладки Actions
  workflow_dispatch:

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Adaptive Ensemble Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python adaptive_ensemble_bot.py
