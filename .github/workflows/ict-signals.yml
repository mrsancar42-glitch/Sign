
name: ICT Futures PRO

on:
  schedule:
    - cron: "*/5 6-23 * * *"
      timezone: "Europe/Istanbul"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ict-futures-pro
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize state
        run: |
          if [ ! -f state.json ]; then
            echo '{"cursors": {}, "sent": []}' > state.json
          fi

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BATCH_SIZE: "40"
          MIN_SCORE: "72"
        run: python ict_bot.py

      - name: Persist state
        run: |
          git config user.name "ICT Futures Bot"
          git config user.email "ict-bot@users.noreply.github.com"

          git add state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update ICT scanner state"
            git push
          fi
          
