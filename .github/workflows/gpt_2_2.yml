
name: GPT 2.2 QUANT INTELLIGENCE

on:
  schedule:
    # Istanbul: 07:05–23:50 (UTC+3)
    - cron: "5,20,35,50 4-20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpt-22-quant
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy requests

      - name: Run GPT 2.2
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SCORE: "78"
          MAX_SYMBOLS: "60"
          MAX_DAILY_SIGNALS: "12"
          MIN_QUOTE_VOLUME: "2000000"
          PYTHONUNBUFFERED: "1"
        run: python gpt_2_2.py

      - name: Save persistent bot state
        if: always()
        run: |
          git config user.name "GPT 2.2 Bot"
          git config user.email "gpt-22-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || {
            git commit -m "GPT 2.2: update trading state"
            git push origin HEAD:main
          }
