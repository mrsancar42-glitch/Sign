
name: GPT 2.2 Quant Intelligence

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt-22-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: state.json
          key: gpt22-state-${{ github.run_id }}
          restore-keys: |
            gpt22-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy requests

      - name: Check Python syntax
        run: |
          python -m py_compile gpt_2_2.py

      - name: Run GPT 2.2
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SCORE: "78"
          MAX_SYMBOLS: "60"
          MAX_DAILY_SIGNALS: "12"
          MIN_QUOTE_VOLUME: "2000000"
        run: |
          python -u gpt_2_2.py
