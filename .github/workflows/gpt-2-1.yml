name: GPT 2.1 Quant Intelligence

on:
  schedule:
    - cron: "5 7-23 * * *"
      timezone: "Europe/Istanbul"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpt-2-1-scanner
  cancel-in-progress: false

jobs:
  scanner:
    name: Full Futures Market Scan
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt requests

      - name: Initialize state
        run: |
          if [ ! -f gpt21_state.json ]; then
            echo '{"sent":[],"daily":{},"last_scan":{}}' > gpt21_state.json
          fi

      - name: Run GPT 2.1
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SCORE: "70"
        run: |
          python -u gpt_2_1.py

      - name: Persist state
        if: always()
        run: |
          git config user.name "GPT 2.1"
          git config user.email "gpt-2-1@users.noreply.github.com"

          git add gpt21_state.json

          if ! git diff --cached --quiet; then
            git commit -m "GPT 2.1 scanner state"
            git push
          fi
          
