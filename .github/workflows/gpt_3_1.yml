
name: GPT 3.1 Quant Intelligence

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt-31
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: gpt31-state-${{ github.run_id }}
          restore-keys: |
            gpt31-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy requests

      - name: Syntax check
        run: python -m py_compile gpt_3_1.py

      - name: Run GPT 3.1
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SCORE: "78"
          MAX_SYMBOLS: "40"
          MAX_DAILY_SIGNALS: "8"
          MIN_QUOTE_VOLUME: "2000000"
        run: python gpt_3_1.py
        
